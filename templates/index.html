<!-- Блок структуры HTML-документа -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roboflow + Replit Example</title>

  <!-- Блок подключения библиотеки Roboflow -->
  <!-- inferencejs используется для запуска модели компьютерного зрения в браузере. -->
  <script src="https://cdn.jsdelivr.net/npm/inferencejs"></script>

  <!-- Блок подключения CSS-файла -->
  <!-- styles.css отвечает за визуальное оформление страницы. -->
  <link rel="stylesheet" href="/static/styles.css" />

  <script>
    // Блок настройки модели Roboflow
    // publishable_key используется для подключения к модели Roboflow.
    var publishable_key = "rf_l8GLzZgLQL6gZLAin1iU";

    // Минимальный базовый порог уверенности модели.
    const CONFIDENCE_THRESHOLD = 0.1;

    // Название используемой модели компьютерного зрения.
    const MODEL_NAME = "microsoft-coco";

    // Версия используемой модели.
    const MODEL_VERSION = 9;
  </script>
</head>

<body>
  <main>
    <!-- Блок описания приложения -->
    <h1>Roboflow + Replit Web Example 🚀</h1>

    <!-- Блок состояния загрузки модели -->
    <p id="loading">Loading...</p>

    <!-- Блок вывода изображения с камеры -->
    <!-- Canvas нужен для отображения видео и рамок вокруг распознанных объектов. -->
    <section class="infer-widget">
      <canvas width="640" height="480" id="video_canvas"></canvas>
    </section>

    <!-- Блок настройки уровня достоверности прогноза -->
    <section id="settings">
      <label for="confidence">Prediction Confidence %</label><br>
      <input type="range" min="1" max="100" value="60" class="slider" id="confidence">
    </section>

    <!-- Блок подключения клиентской логики -->
    <script src="/static/script.js"></script>
  </main>
</body>
</html>
